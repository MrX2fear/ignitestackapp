<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IgniteStack — Ship SaaS Fast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      width: 100%;
    }
    .badge {
      background: #1e293b;
      color: #94a3b8;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(to right, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .subhead {
      font-size: 20px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .subhead strong {
      color: #fff;
    }
    /* Beehiiv embed container — centers and adds spacing */
    .beehiiv-container {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    /* Target the iframe inside the container to ensure it respects dark theme */
    .beehiiv-container iframe {
      background: #0b0e14 !important;
      border-radius: 40px;
    }
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #475569;
    }
    .footer {
      margin-top: 48px;
      color: #334155;
      font-size: 14px;
    }
    .footer a {
      color: #64748b;
      text-decoration: none;
    }
    .footer a:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Badge -->
    <div class="badge">🔥 Launching Soon</div>

    <!-- Headline -->
    <h1>IgniteStack</h1>
    <p class="subhead">
      The ASP.NET Core + React boilerplate<br />
      that gets solo devs shipping in <strong>days, not weeks</strong>.
    </p>

    <!-- Beehiiv Embed Form -->
    <div class="beehiiv-container">
      <script
        async
        src="https://subscribe-forms.beehiiv.com/v3/loader.js"
        data-beehiiv-form="b5154a9f-b89a-49bc-95f7-4dccbb2e8261"
      ></script>
    </div>

    <p class="note">🚀 No spam. Only launch updates.</p>

    <div class="footer">
      &copy; 2026 IgniteStack. Built for solo devs who ship.
    </div>
  </div>
</body>
</html>
